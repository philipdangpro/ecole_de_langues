<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="550" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">MCD — École de langues (groupe 07)</text>

  <!-- ===== LIENS ===== -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <!-- héritage -->
    <line x1="550" y1="130" x2="550" y2="140"/>
    <line x1="550" y1="162" x2="550" y2="172"/>
    <polyline points="340,200 340,172 760,172 760,200"/>
    <!-- DEPENDRE site-siege -->
    <line x1="440" y1="228" x2="500" y2="228"/>
    <line x1="600" y1="228" x2="660" y2="228"/>
    <!-- parrainage -->
    <line x1="95" y1="276" x2="100" y2="330"/>
    <line x1="145" y1="276" x2="150" y2="330"/>
    <!-- RATTACHER -->
    <line x1="220" y1="330" x2="352" y2="302"/>
    <line x1="448" y1="298" x2="700" y2="256"/>
    <!-- ACCUEILLIR -->
    <line x1="800" y1="256" x2="852" y2="282"/>
    <line x1="948" y1="296" x2="950" y2="330"/>
    <!-- CLASSER -->
    <line x1="970" y1="470" x2="970" y2="497"/>
    <line x1="970" y1="533" x2="970" y2="560"/>
    <!-- INSCRIRE -->
    <line x1="280" y1="425" x2="380" y2="425"/>
    <line x1="640" y1="425" x2="860" y2="425"/>
  </g>

  <!-- ===== ENTITÉS ===== -->
  <g stroke="#2b4c7e" stroke-width="2" fill="#eef3fb">
    <rect x="450" y="40" width="200" height="90"/>
    <rect x="240" y="200" width="200" height="56"/>
    <rect x="660" y="200" width="200" height="56"/>
    <rect x="40" y="330" width="240" height="160"/>
    <rect x="860" y="330" width="200" height="140"/>
    <rect x="880" y="560" width="180" height="62"/>
  </g>
  <polygon points="535,162 565,162 550,140" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
  <g stroke="#2b4c7e" stroke-width="1">
    <line x1="450" y1="62" x2="650" y2="62"/>
    <line x1="240" y1="222" x2="440" y2="222"/>
    <line x1="660" y1="222" x2="860" y2="222"/>
    <line x1="40" y1="352" x2="280" y2="352"/>
    <line x1="860" y1="352" x2="1060" y2="352"/>
    <line x1="880" y1="582" x2="1060" y2="582"/>
  </g>
  <g font-size="13" fill="#1d2b44">
    <text x="550" y="56" text-anchor="middle" font-weight="bold">CAMPUS</text>
    <text x="460" y="82" text-decoration="underline">id_campus</text><text x="460" y="100">nom</text><text x="460" y="118">ville</text>

    <text x="340" y="216" text-anchor="middle" font-weight="bold">SIEGE</text>
    <text x="250" y="244" font-style="italic">(hérite de CAMPUS)</text>
    <text x="760" y="216" text-anchor="middle" font-weight="bold">SITE</text>
    <text x="670" y="244" font-style="italic">(hérite de CAMPUS)</text>

    <text x="160" y="346" text-anchor="middle" font-weight="bold">ETUDIANT</text>
    <text x="50" y="372" text-decoration="underline">id_etudiant</text><text x="50" y="390">nom</text><text x="50" y="408">prenom</text>
    <text x="50" y="426">email (unique, facultatif)</text><text x="50" y="444">telephone</text><text x="50" y="462">ville</text>
    <text x="50" y="480">date_inscription</text>

    <text x="960" y="346" text-anchor="middle" font-weight="bold">SESSION_COURS</text>
    <text x="870" y="372" text-decoration="underline">id_session</text><text x="870" y="390">libelle</text><text x="870" y="408">debut</text>
    <text x="870" y="426">duree_minutes</text><text x="870" y="444">capacite</text><text x="870" y="462">prix_unitaire</text>

    <text x="970" y="576" text-anchor="middle" font-weight="bold">CATEGORIE</text>
    <text x="890" y="600" text-decoration="underline">id_categorie</text><text x="890" y="616">libelle</text>
  </g>
  <text x="575" y="156" font-size="11" fill="#2b4c7e" font-style="italic">X : exclusif et total</text>

  <!-- ===== ASSOCIATIONS ===== -->
  <g fill="#fff5e6" stroke="#b36b00" stroke-width="1.5">
    <ellipse cx="550" cy="228" rx="50" ry="18"/>
    <ellipse cx="120" cy="255" rx="62" ry="21"/>
    <ellipse cx="400" cy="300" rx="48" ry="18"/>
    <ellipse cx="900" cy="289" rx="48" ry="18"/>
    <ellipse cx="970" cy="515" rx="42" ry="18"/>
  </g>
  <g font-size="11" fill="#6b3e00" text-anchor="middle" font-weight="bold">
    <text x="550" y="232">DEPENDRE</text>
    <text x="120" y="259">PARRAINER</text>
    <text x="400" y="304">RATTACHER</text>
    <text x="900" y="293">ACCUEILLIR</text>
    <text x="970" y="519">CLASSER</text>
  </g>

  <!-- INSCRIRE : association porteuse -->
  <rect x="380" y="340" width="260" height="170" rx="28" fill="#fff5e6" stroke="#b36b00" stroke-width="2.5"/>
  <line x1="395" y1="366" x2="625" y2="366" stroke="#b36b00"/>
  <g font-size="13" fill="#6b3e00">
    <text x="510" y="358" text-anchor="middle" font-weight="bold">INSCRIRE (porteuse)</text>
    <text x="400" y="388" text-decoration="underline">id_inscription</text>
    <text x="400" y="408">date_operation</text>
    <text x="400" y="428">nb_places</text>
    <text x="400" y="448">montant</text>
    <text x="400" y="468">statut (CONFIRMEE | ANNULEE)</text>
    <text x="400" y="488">id_groupe (facultatif)</text>
  </g>

  <!-- ===== CARDINALITÉS ===== -->
  <g font-size="11" fill="#c0392b" font-weight="bold">
    <text x="446" y="220">(0,n)</text>
    <text x="620" y="220">(1,1)</text>
    <text x="10" y="300">(0,1) parrain</text>
    <text x="160" y="318">(0,n) filleuls</text>
    <text x="225" y="322">(1,1)</text>
    <text x="640" y="262">(0,n)</text>
    <text x="808" y="270">(0,n)</text>
    <text x="956" y="322">(1,1)</text>
    <text x="978" y="490">(1,1)</text>
    <text x="978" y="552">(0,n)</text>
    <text x="288" y="418">(0,n)</text>
    <text x="820" y="418">(0,n)</text>
  </g>

  <g font-size="11" fill="#444">
    <text x="40" y="596">Souligné = identifiant. Rouge = cardinalités (min,max).</text>
    <text x="40" y="612">Héritage : CAMPUS se décline en SIEGE et SITE.</text>
  </g>
</svg>
